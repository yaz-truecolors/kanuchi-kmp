name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ジョブ名 build-lint-test は main のルールセットで必須ステータスチェックに指定されている。
  # 名前を変えると必須チェックが満たされずPRをマージできなくなるため、変更しないこと。
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Chrome (for wasmJs browser tests)
        uses: browser-actions/setup-chrome@v2

      # ローカルと同じ集約タスク（ルートの build.gradle.kts の verify）を実行する。
      # --continue で失敗しても残りのタスクを実行し、失敗したタスクをまとめて報告させる。
      # UI 描画スモークテスト（:app-wasmjs:smokeTest）も verify に含まれる（Node.js・Chromium は Gradle タスク側で用意する）。
      - name: Verify (ktlintCheck / detekt / allTests / wasmJsBrowserDistribution / smokeTest)
        run: ./gradlew verify --continue

      # スモークテストが失敗したときの原因調査用（スクリーンショット・コンソールログ・Playwright トレース）
      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # DBテスト（supabase/tests/database/ の pgTAP テスト）。RLS・トリガー・招待制Hook のアクセス制御ルールを、
  # Supabase の実際の Postgres イメージにマイグレーションを適用した状態で検証する。
  # ジョブ名 db-test は、main のルールセットの必須ステータスチェックに追加する予定（追加後は名前を変更しないこと）。
  # 必須チェックはスキップされると pending のままになりマージできなくなるため、paths フィルタは使わず全PRで実行する。
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Renovate が更新する（renovate.json の customManagers）。supabase-deploy.yml と同じバージョンにそろえること。
      SUPABASE_CLI_VERSION: 2.118.0
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # ローカルと同じスクリプトを実行する（Postgres のみ起動 → マイグレーション適用 → supabase test db）
      - name: Run database tests (pgTAP)
        run: ./supabase/tests/run.sh

  deploy-pages:
    needs: build-lint-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs distribution
        run: ./gradlew :app-wasmjs:wasmJsBrowserDistribution

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app-wasmjs/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
