name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ジョブ名 build-lint-test は main のルールセットで必須ステータスチェックに指定されている。
  # 名前を変えると必須チェックが満たされずPRをマージできなくなるため、変更しないこと。
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Chrome (for wasmJs browser tests)
        uses: browser-actions/setup-chrome@v2

      # ローカルと同じ集約タスク（ルートの build.gradle.kts の verify）を実行する。
      # --continue で失敗しても残りのタスクを実行し、失敗したタスクをまとめて報告させる。
      - name: Verify (ktlintCheck / detekt / allTests / wasmJsBrowserDistribution)
        run: ./gradlew verify --continue

  deploy-pages:
    needs: build-lint-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs distribution
        run: ./gradlew :app-wasmjs:wasmJsBrowserDistribution

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app-wasmjs/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
