build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140

complexity:
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    thresholdInClasses: 20

naming:
  FunctionNaming:
    active: true
    # Compose の @Composable 関数は PascalCase で命名する慣習（公式 API ガイドライン）と衝突するため、
    # @Composable が付いた関数は対象外にする（ktlint 側も .editorconfig で同様に許可している）。
    ignoreAnnotated: ["Composable"]
    # テストのバッククォート関数名を許容する
    excludes: ["**/commonTest/**", "**/*Test.kt"]

comments:
  active: false
